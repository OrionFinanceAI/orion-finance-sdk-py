name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install uv
        run: |
          make uv-download

      - name: Install dependencies
        run: |
          make venv
          uv sync --frozen --extra dev --extra docs
          make install

      - name: Run docstrings checks
        run: |
          make docstyle

      - name: Run type checker (ty)
        run: |
          make typecheck

      - name: Build documentation (dry run)
        run: |
          make docs

      - name: Run tests
        env:
          # Fork tests skip unless ALCHEMY_API_KEY or RPC_URL is set
          ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          WEB3_ETHEREUM_SEPOLIA_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
        run: |
          make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: OrionFinanceAI/orion-finance-sdk-py
          files: ./coverage.xml
          fail_ci_if_error: false
