name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Cache Python packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install uv
        run: |
          make uv-download

      - name: Install dependencies
        run: |
          make venv
          uv sync --frozen --extra dev --extra docs
          make install

      - name: Run docstrings checks
        run: |
          make docstyle

      - name: Run type checker (ty)
        run: |
          make typecheck

      - name: Build documentation (dry run)
        run: |
          make docs

      - name: Run tests
        env:
          # Fork tests skip unless ALCHEMY_API_KEY or RPC_URL is set
          ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
          WEB3_ETHEREUM_SEPOLIA_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
        run: |
          make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: OrionFinanceAI/orion-finance-sdk-py
          files: ./coverage.xml
          fail_ci_if_error: false
